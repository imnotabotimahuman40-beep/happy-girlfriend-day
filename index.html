<!DOCTYPE html>
<html>
<head>
<title>Happy Girlfriend's Day ❤️</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff9ec4,#ffd6e8);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
color:white;
overflow:hidden;
}
.container{
background:rgba(255,255,255,.15);
padding:30px;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 30px rgba(0,0,0,.2);
max-width:350px;
}
h1{font-size:32px;}
button{
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
background:white;
color:#ff4081;
margin-top:20px;
}
#msg{
display:none;
margin-top:20px;
font-size:18px;
line-height:1.6;
}
</style>
</head>

<body>

<div class="container">
<h1>Happy Girlfriend's Day ❤️</h1>
<h2>Ananya 🌸</h2>

<p>From your forever person,<br><b>Sumedh</b></p>

<button onclick="showLove()">Open My Heart 💖</button>

<div id="msg">
You are the most beautiful part of my life. ❤️<br><br>
Every smile of yours makes my day brighter.<br><br>
Thank you for always being you.<br><br>
Happy Girlfriend's Day, my love. 🌹<br><br>
I Love You Forever ♾️❤️
</div>
</div>

<script>
function showLove(){
document.getElementById("msg").style.display="block";
}
</script>

</body>
</html>
